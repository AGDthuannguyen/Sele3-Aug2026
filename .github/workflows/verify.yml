name: Verify

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            marker: not browser
          - suite: chrome
            marker: browser
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install poetry==2.4.2
          poetry check --lock
          poetry sync
      - name: Check changed lines
        if: matrix.suite == 'unit'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          elif git show-ref --verify --quiet refs/remotes/origin/main && [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            git diff --check origin/main...HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Run tests
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: '1'
        run: >-
          poetry run pytest -v -o faulthandler_timeout=60 -m "${{ matrix.marker }}" --browser=chrome --headless --maxfail=1
          --junitxml=artifacts/junit.xml --alluredir=artifacts/allure-results
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.suite }}-results
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
